<style>
:root {
  --color-primary: #B08C80;
  --color-primary-light: #D4B5AA;
  --color-primary-soft: #E8D5CC;
  --color-primary-dark: #8C6F65;
  --color-accent: #C9A876;
  --color-cream: #FAF7F5;
  --color-cream-dark: #F2EBE6;
  --color-ink: #3D2E2A;
  --color-ink-light: #6B5750;
  --color-ink-soft: #9A8A83;
  --color-line: #EAE0DA;
  --color-white: #FFFFFF;
  --shadow-sm: 0 2px 8px rgba(176, 140, 128, 0.08);
  --shadow-md: 0 8px 24px rgba(176, 140, 128, 0.12);
  --shadow-lg: 0 24px 60px rgba(140, 111, 101, 0.18);
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --font-serif: 'Noto Serif JP', 'Cormorant Garamond', serif;
  --font-sans: 'Noto Sans JP', -apple-system, sans-serif;
  --font-display: 'Cormorant Garamond', 'Noto Serif JP', serif;
  --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  font-family: var(--font-sans);
  color: var(--color-ink);
  background: var(--color-cream);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-size: 15px;
  line-height: 1.7;
  letter-spacing: 0.02em;
}

body {
  position: relative;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at top left, rgba(212, 181, 170, 0.18), transparent 50%),
    radial-gradient(ellipse at bottom right, rgba(201, 168, 118, 0.12), transparent 50%),
    var(--color-cream);
}

.hidden { display: none !important; }

/* Decorative ornaments */
.ornament {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 0;
  filter: blur(80px);
  opacity: 0.4;
}
.ornament-1 {
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, var(--color-primary-light), transparent);
  top: -100px;
  right: -100px;
  animation: float 20s ease-in-out infinite;
}
.ornament-2 {
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(201, 168, 118, 0.4), transparent);
  bottom: -150px;
  left: -150px;
  animation: float 25s ease-in-out infinite reverse;
}
.ornament-3 {
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, var(--color-primary-soft), transparent);
  top: 40%;
  left: 60%;
  animation: float 18s ease-in-out infinite;
  animation-delay: -5s;
}

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(30px, -30px) scale(1.05); }
  66% { transform: translate(-20px, 20px) scale(0.95); }
}

/* Header */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(250, 247, 245, 0.85);
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border-bottom: 1px solid var(--color-line);
}

.header-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-mark {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--color-cream), var(--color-primary-soft));
  border-radius: 50%;
  box-shadow: var(--shadow-sm);
}

.brand-mark svg {
  width: 30px;
  height: 30px;
}

.brand-text { line-height: 1.1; }

.brand-name {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 500;
  color: var(--color-primary-dark);
  letter-spacing: 0.04em;
  font-style: italic;
}

.brand-tagline {
  font-size: 10.5px;
  color: var(--color-ink-soft);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-top: 2px;
  font-weight: 500;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 14px;
  width: 18px;
  height: 18px;
  color: var(--color-ink-soft);
  pointer-events: none;
}

#searchInput {
  width: 280px;
  padding: 11px 16px 11px 42px;
  border: 1px solid var(--color-line);
  border-radius: 999px;
  background: var(--color-white);
  color: var(--color-ink);
  font-family: var(--font-sans);
  font-size: 13.5px;
  outline: none;
  transition: all var(--transition);
}

#searchInput::placeholder { color: var(--color-ink-soft); }

#searchInput:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 4px rgba(176, 140, 128, 0.12);
  background: var(--color-white);
}

.refresh-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--color-line);
  background: var(--color-white);
  color: var(--color-primary-dark);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: all var(--transition);
}

.refresh-btn svg { width: 18px; height: 18px; }

.refresh-btn:hover {
  background: var(--color-primary);
  color: var(--color-white);
  border-color: var(--color-primary);
  transform: rotate(180deg);
}

/* Main */
.main-content {
  max-width: 1280px;
  margin: 0 auto;
  padding: 64px 32px 80px;
  position: relative;
  z-index: 1;
}

/* Hero */
.hero {
  text-align: center;
  margin-bottom: 72px;
  animation: fadeInUp 0.8s var(--transition) backwards;
}

.hero-eyebrow {
  font-family: var(--font-display);
  font-style: italic;
  color: var(--color-primary);
  letter-spacing: 0.2em;
  font-size: 14px;
  margin-bottom: 16px;
}

.hero-title {
  font-family: var(--font-serif);
  font-weight: 300;
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.25;
  color: var(--color-ink);
  letter-spacing: 0.05em;
  margin-bottom: 20px;
}

.hero-desc {
  color: var(--color-ink-light);
  font-size: 14.5px;
  max-width: 480px;
  margin: 0 auto 40px;
  line-height: 1.9;
}

.stats {
  display: inline-flex;
  align-items: center;
  gap: 32px;
  padding: 20px 40px;
  background: var(--color-white);
  border: 1px solid var(--color-line);
  border-radius: 999px;
  box-shadow: var(--shadow-sm);
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.stat-num {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 500;
  color: var(--color-primary-dark);
  line-height: 1;
}

.stat-label {
  font-size: 11px;
  color: var(--color-ink-soft);
  letter-spacing: 0.15em;
}

.stat-divider {
  width: 1px;
  height: 32px;
  background: var(--color-line);
}

/* Section */
.customers-section { animation: fadeInUp 0.8s var(--transition) 0.15s backwards; }

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--color-line);
}

.section-title {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: 0.08em;
}

.section-title::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--color-primary);
  border-radius: 50%;
  margin-right: 12px;
  vertical-align: middle;
  transform: translateY(-2px);
}

.section-count {
  font-size: 12px;
  color: var(--color-ink-soft);
  letter-spacing: 0.1em;
}

/* Loading */
.loading-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 0;
  color: var(--color-ink-soft);
}

.loader {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.loader-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--color-primary);
  animation: bounce 1.4s ease-in-out infinite;
}
.loader-dot:nth-child(2) { animation-delay: 0.16s; }
.loader-dot:nth-child(3) { animation-delay: 0.32s; }

@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
  40% { transform: scale(1); opacity: 1; }
}

.loading-state p {
  font-size: 13px;
  letter-spacing: 0.1em;
}

/* Empty */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--color-ink-soft);
}

.empty-icon {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  color: var(--color-primary-light);
}

.empty-title {
  font-family: var(--font-serif);
  font-size: 18px;
  color: var(--color-ink);
  margin-bottom: 8px;
}

.empty-desc { font-size: 13px; }

/* Customer Grid */
.customer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}

.customer-card {
  background: var(--color-white);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-md);
  padding: 24px 24px 20px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all var(--transition);
  animation: cardIn 0.6s var(--transition) backwards;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.customer-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--color-primary-soft), transparent);
  opacity: 0;
  transition: opacity var(--transition);
  pointer-events: none;
}

.customer-card::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--transition);
}

.customer-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--color-primary-light);
}

.customer-card:hover::before { opacity: 0.3; }
.customer-card:hover::after { transform: scaleX(1); }

.card-head {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
  position: relative;
  z-index: 1;
}

.avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  color: var(--color-white);
  display: grid;
  place-items: center;
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}

.card-name-block { min-width: 0; flex: 1; }

.card-name {
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 500;
  color: var(--color-ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-furigana {
  font-size: 11.5px;
  color: var(--color-ink-soft);
  letter-spacing: 0.08em;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.card-info-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--color-ink-light);
}

.card-info-row svg {
  width: 13px;
  height: 13px;
  color: var(--color-primary);
  flex-shrink: 0;
}

.card-info-row span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-foot {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px dashed var(--color-line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--color-ink-soft);
  letter-spacing: 0.08em;
  position: relative;
  z-index: 1;
}

.card-date { display: flex; align-items: center; gap: 6px; }

.card-arrow {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--color-cream-dark);
  display: grid;
  place-items: center;
  color: var(--color-primary-dark);
  transition: all var(--transition);
}

.customer-card:hover .card-arrow {
  background: var(--color-primary);
  color: var(--color-white);
  transform: translateX(2px);
}

.card-arrow svg { width: 12px; height: 12px; }

/* Modal */
.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.modal.is-open {
  display: flex;
  animation: modalIn 0.4s var(--transition);
}

@keyframes modalIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(61, 46, 42, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.modal-panel {
  position: relative;
  background: var(--color-cream);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 720px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: panelIn 0.5s var(--transition);
}

@keyframes panelIn {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-close {
  position: sticky;
  top: 16px;
  margin-left: auto;
  margin-right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--color-line);
  background: var(--color-white);
  color: var(--color-ink);
  cursor: pointer;
  display: grid;
  place-items: center;
  z-index: 5;
  transition: all var(--transition);
  float: right;
}

.modal-close svg { width: 16px; height: 16px; }

.modal-close:hover {
  background: var(--color-primary);
  color: var(--color-white);
  border-color: var(--color-primary);
  transform: rotate(90deg);
}

.modal-content {
  padding: 12px 48px 56px;
  clear: both;
}

/* Modal Inner */
.detail-hero {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 24px 0 28px;
  border-bottom: 1px solid var(--color-line);
  margin-bottom: 28px;
}

.detail-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
  color: var(--color-white);
  display: grid;
  place-items: center;
  font-family: var(--font-serif);
  font-size: 34px;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  flex-shrink: 0;
}

.detail-name-block { min-width: 0; }

.detail-eyebrow {
  font-family: var(--font-display);
  font-style: italic;
  color: var(--color-primary);
  font-size: 12px;
  letter-spacing: 0.2em;
  margin-bottom: 6px;
}

.detail-name {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 500;
  color: var(--color-ink);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
  word-break: break-word;
}

.detail-furigana {
  font-size: 12.5px;
  color: var(--color-ink-soft);
  letter-spacing: 0.1em;
}

.detail-section {
  margin-bottom: 32px;
}

.detail-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 500;
  color: var(--color-primary-dark);
  letter-spacing: 0.18em;
  margin-bottom: 16px;
}

.detail-section-title::before {
  content: '';
  width: 18px;
  height: 1px;
  background: var(--color-primary);
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.detail-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 16px;
  padding: 14px 16px;
  background: var(--color-white);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  align-items: start;
}

.detail-label {
  font-size: 11.5px;
  color: var(--color-ink-soft);
  letter-spacing: 0.12em;
  padding-top: 2px;
}

.detail-value {
  font-size: 14px;
  color: var(--color-ink);
  word-break: break-word;
  font-weight: 500;
}

.detail-value-sub {
  font-size: 11.5px;
  color: var(--color-ink-soft);
  margin-left: 8px;
  font-weight: 400;
}

.copyable {
  cursor: pointer;
  transition: color var(--transition);
}
.copyable:hover { color: var(--color-primary); }

.consent-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
}

.consent-yes {
  background: rgba(176, 140, 128, 0.14);
  color: var(--color-primary-dark);
}

.consent-no {
  background: var(--color-cream-dark);
  color: var(--color-ink-light);
}

.notice-confirmed {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  background: linear-gradient(135deg, var(--color-primary-soft), var(--color-cream));
  border: 1px solid var(--color-primary-light);
  border-radius: var(--radius-sm);
  margin-bottom: 16px;
}

.notice-confirmed-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--color-primary);
  color: var(--color-white);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.notice-confirmed-icon svg { width: 16px; height: 16px; }

.notice-confirmed-text {
  font-size: 13px;
  color: var(--color-primary-dark);
  font-weight: 500;
}

.notice-confirmed-text strong { font-size: 14px; }

.notice-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.notice-item {
  background: var(--color-white);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-sm);
  overflow: hidden;
}

.notice-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background var(--transition);
}

.notice-head:hover { background: var(--color-cream-dark); }

.notice-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--color-primary-soft);
  color: var(--color-primary-dark);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

.notice-title {
  flex: 1;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--color-ink);
}

.notice-toggle {
  color: var(--color-ink-soft);
  transition: transform var(--transition);
}

.notice-toggle svg { width: 14px; height: 14px; }

.notice-item.is-open .notice-toggle { transform: rotate(180deg); }

.notice-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
  padding: 0 18px;
  border-top: 1px solid transparent;
}

.notice-item.is-open .notice-body {
  max-height: 800px;
  padding: 14px 18px 18px;
  border-top-color: var(--color-line);
}

.notice-body p {
  font-size: 12.5px;
  color: var(--color-ink-light);
  line-height: 1.85;
  margin-bottom: 8px;
}

.notice-body ul {
  list-style: none;
  padding: 0;
  margin: 8px 0 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.notice-body li {
  font-size: 12.5px;
  color: var(--color-ink-light);
  line-height: 1.8;
  padding-left: 16px;
  position: relative;
}

.notice-body li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  width: 6px;
  height: 1px;
  background: var(--color-primary);
}

/* Footer */
.site-footer {
  text-align: center;
  padding: 32px 20px 24px;
  font-family: var(--font-display);
  font-style: italic;
  color: var(--color-ink-soft);
  font-size: 12px;
  letter-spacing: 0.15em;
  position: relative;
  z-index: 1;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--color-ink);
  color: var(--color-white);
  padding: 12px 24px;
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: 0.05em;
  z-index: 2000;
  opacity: 0;
  transition: all var(--transition);
  pointer-events: none;
  box-shadow: var(--shadow-lg);
}

.toast.show {
