<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#B08C80">
  <title>Nuae - カウンセリング結果</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="ornament ornament-1"></div>
  <div class="ornament ornament-2"></div>
  <div class="ornament ornament-3"></div>

  <div id="loginScreen" class="login-screen">
    <form id="loginForm" class="login-card" method="POST" action="javascript:void(0);" novalidate>
      <div class="login-mark">
        <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="loginGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#D4B5AA"/>
              <stop offset="100%" stop-color="#8C6F65"/>
            </linearGradient>
          </defs>
          <path d="M30 8 C18 8 10 18 10 30 C10 42 18 52 30 52 C42 52 50 42 50 30 C50 22 46 16 40 12 C36 18 38 26 32 30 C26 34 22 28 24 22 C20 24 18 28 18 32 C18 40 24 46 30 46" fill="none" stroke="url(#loginGrad)" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="30" cy="30" r="2" fill="url(#loginGrad)"/>
        </svg>
      </div>
      <p class="login-eyebrow">— Nuae Nail Salon —</p>
      <h1 class="login-title">Counseling Records</h1>
      <p class="login-desc">パスワードを入力してください</p>
      <div class="login-input-wrap">
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <span>ログイン</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>

  <div id="appShell" class="hidden">
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#D4B5AA"/>
                  <stop offset="100%" stop-color="#8C6F65"/>
                </linearGradient>
              </defs>
              <path d="M30 8 C18 8 10 18 10 30 C10 42 18 52 30 52 C42 52 50 42 50 30 C50 22 46 16 40 12 C36 18 38 26 32 30 C26 34 22 28 24 22 C20 24 18 28 18 32 C18 40 24 46 30 46" fill="none" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round"/>
              <circle cx="30" cy="30" r="2" fill="url(#brandGrad)"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="brand-name">Nuae</h1>
            <p class="brand-tagline">Counseling Records</p>
          </div>
        </div>

        <div class="header-actions">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.5-3.5"/>
            </svg>
            <input type="text" id="searchInput" placeholder="お名前・電話番号で検索" autocomplete="off">
          </div>
          <button class="icon-btn" id="refreshBtn" title="再読み込み">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 0 1 15.5-6.36L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-15.5 6.36L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
          </button>
          <button class="icon-btn" id="logoutBtn" title="ログアウト">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="main-content">
      <section class="hero">
        <p class="hero-eyebrow">— Nuae Nail Salon —</p>
        <h2 class="hero-title">カウンセリング<br>レコード</h2>
        <p class="hero-desc">お客様お一人おひとりとの大切な記録を、丁寧にお届けします。</p>
        <div class="stats">
          <div class="stat">
            <span class="stat-num" id="totalCount">—</span>
            <span class="stat-label">登録件数</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat-num" id="recentCount">—</span>
            <span class="stat-label">直近30日</span>
          </div>
        </div>
      </section>

      <section class="customers-section">
        <div class="section-head">
          <h3 class="section-title">お客様一覧</h3>
          <span class="section-count" id="visibleCount"></span>
        </div>

        <div id="loadingState" class="loading-state">
          <div class="loader">
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
          </div>
          <p>カルテを読み込み中...</p>
        </div>

        <div id="emptyState" class="empty-state hidden">
          <div class="empty-icon">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="32" cy="32" r="28"/>
              <path d="M22 28 Q32 36 42 28" stroke-linecap="round"/>
              <circle cx="24" cy="22" r="1.5" fill="currentColor"/>
              <circle cx="40" cy="22" r="1.5" fill="currentColor"/>
            </svg>
          </div>
          <p class="empty-title">該当するお客様がいません</p>
          <p class="empty-desc">検索条件を変更してお試しください</p>
        </div>

        <div id="customerGrid" class="customer-grid"></div>
      </section>
    </main>

    <div id="detailModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-panel" role="dialog" aria-modal="true">
        <button class="modal-close" id="modalClose" aria-label="閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6 18 18 M18 6 6 18"/>
          </svg>
        </button>
        <div class="modal-content" id="modalContent"></div>
      </div>
    </div>

    <footer class="site-footer">
      <p>© Nuae Nail Salon — Counseling Tool</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
